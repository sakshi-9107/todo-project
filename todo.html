<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>To-Do List</title>
</head>
<body>
    <section class="todo">
        <div>
       <h1><i>To-do List</i></h1>
        </div>
        <div class="input"> 
            
            <input 
             type="text"
              class="input-field" 
              id="todoInput" 
              placeholder="Add a new todo">
              <button class="btn">Add</button>
        </div>
         
        <ul class="scroll">
            <li id="todolist"></li>
        </ul>
        <div>
            <hr class="counter">
            <div class="counter-container">
                <p><span> 0 </span>items total</p>
                <button id="deletebutton">Delete All</button>
            </div>
        </div>
    </section>
    <footer>
        <div class="footer">
            <p class="made-by">Made by:</p>
            <p class="author"><i>
                Priyal Kote<br>
                Sakshi Kadam<br>
                Smit Kotewar<br>
            </i></p>
        </div>
    </footer>
</body>
</html>
